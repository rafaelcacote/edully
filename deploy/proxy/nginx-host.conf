# Nginx do host → containers Edully
#
# Homolog: 127.0.0.1:8081  (develop)  → http://homolog.agendaedully.com.br/
# Prod:    127.0.0.1:8082  (master)   → http://app.agendaedully.com.br/
# Demo:    127.0.0.1:8083  (develop)  → http://demo.agendaedully.com.br/
#
# Instalar:
#   sudo cp deploy/proxy/nginx-host.conf /etc/nginx/sites-available/edully
#   sudo ln -sf /etc/nginx/sites-available/edully /etc/nginx/sites-enabled/edully
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (opcional):
#   sudo certbot --nginx -d homolog.agendaedully.com.br -d app.agendaedully.com.br -d demo.agendaedully.com.br

# --- Homologação (branch develop) ---
server {
    listen 80;
    listen [::]:80;
    server_name homolog.agendaedully.com.br;

    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}

