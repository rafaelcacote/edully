name: edully-demo

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: edully-app:demo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: demo
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:8083:80"
    volumes:
      - demo_storage:/var/www/html/storage/app
      - demo_logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edully_demo

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-edully_demo}
      POSTGRES_USER: ${DB_USERNAME:-edully}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      # Postgres 18+: montar /var/lib/postgresql (não .../data)
      - demo_pgdata:/var/lib/postgresql
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-edully} -d ${DB_DATABASE:-edully_demo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - edully_demo

volumes:
  demo_pgdata:
  demo_storage:
  demo_logs:

networks:
  edully_demo:
    name: edully_demo
