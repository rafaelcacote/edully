name: edully-staging

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: edully-app:staging
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: staging
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - staging_storage:/var/www/html/storage/app
      - staging_logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edully_staging

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-edully_staging}
      POSTGRES_USER: ${DB_USERNAME:-edully}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      # Postgres 18+: montar /var/lib/postgresql (não .../data)
      - staging_pgdata:/var/lib/postgresql
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-edully} -d ${DB_DATABASE:-edully_staging}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - edully_staging

volumes:
  staging_pgdata:
  staging_storage:
  staging_logs:

networks:
  edully_staging:
    name: edully_staging
